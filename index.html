<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const dir = (x, y, z) => V(x, y, z).normalize();

// ---------- 몸 모양: 방향(단위 벡터) → 표면 위의 점 ----------
// 기니피그 특징: 목이 없는 한 덩어리 · 아래가 넓은 배 모양 · 넓고 뭉툭한 주둥이 · 볼록한 이마
const BUMPS = [
  [dir(0.26, -0.07, 1), 0.36, 0.085], [dir(-0.26, -0.07, 1), 0.36, 0.085],       // 도톰한 주둥이 (좌우 두 덩이)
  [dir(0.09, -0.22, 1), 0.13, 0.025], [dir(-0.09, -0.22, 1), 0.13, 0.025], // 윗입술 두 쪽
  [dir(0, 0.32, 1), 0.5, 0.09],                                             // 볼록한 이마
  [dir(0.62, -0.3, 0.65), 0.35, 0.06], [dir(-0.62, -0.3, 0.65), 0.35, 0.06], // 볼
];
function P(d) {
  let x = 0.6 * d.x * (1 - 0.15 * d.y), y = 0.56 * d.y, z = 0.8 * Math.sign(d.z) * Math.abs(d.z) ** 0.8;
  if (y < -0.38) y = -0.38 + (y + 0.38) * 0.3;            // 바닥을 납작하게
  for (const [c, sg, amp] of BUMPS) {
    const a = Math.acos(Math.min(1, Math.max(-1, d.dot(c)))), k = amp * Math.exp(-(a * a) / (sg * sg));
    x += c.x * k; y += c.y * k; z += c.z * k;
  }
  return V(x, y + 0.45, z);
}
function N(d) {
  const a = Math.abs(d.y) < 0.9 ? V(0, 1, 0) : V(1, 0, 0);
  const t1 = a.clone().cross(d).normalize(), t2 = d.clone().cross(t1);
  const p = P(d), e = 0.02;
  const pa = P(d.clone().addScaledVector(t1, e).normalize()).sub(p);
  const pb = P(d.clone().addScaledVector(t2, e).normalize()).sub(p);
  const n = pa.cross(pb).normalize();
  return n.dot(d) < 0 ? n.negate() : n;
}
const D_HEAD = dir(0, 0.62, 0.78);
const NOSE = P(dir(0, 0.03, 1)), MOUTH = P(dir(0, -0.26, 1)), FORE = P(D_HEAD);
const SEG = new THREE.Line3(NOSE, MOUTH), segDist = p => SEG.closestPointToPoint(p, true, V()).distanceTo(p);
const EYES = [-1, 1].map(s => P(dir(s * 0.6, 0.4, 0.74)));

// ---------- 색 · 무늬 ----------
const C = h => new THREE.Color(h);
const ss = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
const wob = (x, y, z) => 0.05 * Math.sin(7 * x + 3 * y) + 0.04 * Math.sin(9 * z + 5 * x) + 0.03 * Math.sin(13 * y + 4 * z);
const blaze = (x, y, z) => {            // 이마에서 코로 내려오며 넓어지는 흰 줄
  const w = 0.07 + 0.5 * Math.max(0, z - 0.62) + 0.25 * Math.max(0, 0.5 - y);
  return (1 - ss(w, w + 0.06, Math.abs(x) + wob(x, y, z) * 0.2)) * ss(0.15, 0.3, z);
};
const band = (x, y, z, a, b) => { const v = z + wob(x, y, z) * 0.5; return ss(a - 0.05, a + 0.05, v) * (1 - ss(b - 0.05, b + 0.05, v)); };
const WHITE = C('#fbf6ee'), BLACK = C('#1d1716'), ORANGE = C('#c9762f'), GOLD = C('#dba55f'),
      CREAM = C('#f1dfc0'), GREY = C('#8a8079'), DARK = C('#4a342c'), PINK = C('#f2b4ad'), SKIN = C('#f7d3cc');
const dutch = base => (x, y, z) => base.clone().lerp(WHITE, Math.max(blaze(x, y, z), band(x, y, z, -0.25, 0.2)));

const PATTERNS = [
  { name: '삼색', kind: '세 가지 색', photo: '03', fn: (x, y, z) => {
      const side = ss(-0.06, 0.06, x + 0.1 * Math.sin(4 * z));
      const c = z > 0.2 ? BLACK.clone().lerp(ORANGE, side) : ORANGE.clone().lerp(BLACK, side);
      return c.lerp(WHITE, Math.max(blaze(x, y, z), band(x, y, z, -0.25, 0.2)));
    } },
  { name: '흑백', kind: '흰 줄 · 흰 띠', photo: '07', fn: dutch(BLACK) },
  { name: '주황 흰 띠', kind: '흰 줄 · 흰 띠', photo: '08', fn: dutch(ORANGE) },
  { name: '회색 흰 띠', kind: '흰 줄 · 흰 띠', photo: '09', fn: dutch(GREY) },
  { name: '히말라얀', kind: '빨간 눈 · 짙은 코', photo: '01', eye: '#a3243b', ear: DARK, feet: DARK, nose: DARK,
    fn: (x, y, z) => WHITE.clone().lerp(DARK, 1 - ss(0.07, 0.15, Math.hypot(x - NOSE.x, y - NOSE.y, z - NOSE.z) + wob(x, y, z) * 0.3)) },
  { name: '흰 관모', kind: '이마 흰 점', photo: '22', fn: (x, y, z) =>
      ORANGE.clone().lerp(WHITE, 1 - ss(0.11, 0.15, Math.hypot(x - FORE.x, y - FORE.y, z - FORE.z))) },
  { name: '황금', kind: '단색', photo: '20', fn: () => GOLD.clone() },
  { name: '크림', kind: '단색', photo: '24', fn: () => CREAM.clone() },
  { name: '검정', kind: '단색', photo: '06', fn: () => BLACK.clone() },
];

// ---------- 기니피그 만들기 ----------
const skin = o => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.75 }, o));
function ell(r, p, color, mat) {
  const g = new THREE.SphereGeometry(1, 28, 20); g.scale(r[0], r[1], r[2]);
  const m = new THREE.Mesh(g, mat || skin({ color }));
  m.position.copy(p.isVector3 ? p : V(...p)); m.castShadow = true;
  return m;
}
const plush = o => new THREE.MeshPhysicalMaterial(Object.assign({ roughness: 1, sheen: 0.25, sheenRoughness: 0.75, sheenColor: C('#fff0e0') }, o));

function makePig(pt) {
  const pig = new THREE.Group(), fn = pt.fn;

  // 몸통 (한 덩어리, 털 없음)
  const g = new THREE.SphereGeometry(1, 96, 72), pos = g.attributes.position, nor = g.attributes.normal;
  const cols = new Float32Array(pos.count * 3), d = V();
  for (let i = 0; i < pos.count; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    const p = P(d), n = N(d), c = fn(p.x, p.y, p.z);
    pos.setXYZ(i, p.x, p.y, p.z); nor.setXYZ(i, n.x, n.y, n.z); cols.set([c.r, c.g, c.b], i * 3);
    if (!pt.nose) { c.lerp(SKIN, 0.65 * (1 - ss(0.035, 0.1, segDist(p)))); cols.set([c.r, c.g, c.b], i * 3); }   // 코 · 입 둘레 분홍 살
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const body = new THREE.Mesh(g, plush({ vertexColors: true })); body.castShadow = true; pig.add(body);

  // 코: 넓은 분홍 코 + 콧구멍 + 인중
  const noseCol = pt.nose || PINK, darkM = skin({ color: '#7a4a48' });
  const nose = new THREE.Group(); nose.position.copy(NOSE).add(V(0, 0, -0.012)); pig.add(nose);
  nose.add(ell([0.072, 0.044, 0.03], [0, 0, 0], noseCol));
  nose.add(ell([0.03, 0.04, 0.022], [0, -0.035, 0.002], noseCol));
  for (const s of [-1, 1]) {
    const hole = ell([0.02, 0.009, 0.01], [s * 0.036, -0.004, 0.024], null, darkM);
    hole.rotation.z = s * 0.5; hole.castShadow = false; nose.add(hole);
  }
  const sp = (dx, dy) => { const dd = dir(dx, dy, 1); return P(dd).addScaledVector(N(dd), 0.004); };
  const tube = pts => pig.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.0055, 6), darkM));
  tube([sp(0, -0.05), sp(0, -0.12), sp(0, -0.18)]);                                    // 인중
  for (const s of [-1, 1]) tube([sp(0, -0.18), sp(s * 0.05, -0.225), sp(s * 0.105, -0.215)]);   // 윗입술 (ω 모양)

  // 입: 입 안 + 분홍 아랫입술 + 앞니
  const mouth = ell([1, 1, 1], MOUTH, null, skin({ color: '#6b2a2a' })); mouth.castShadow = false; pig.add(mouth);
  const lip = ell([0.05, 0.022, 0.03], MOUTH, pt.nose ? DARK : C('#e79a98')); lip.castShadow = false; pig.add(lip);
  const teeth = new THREE.Group(), toothMat = skin({ color: '#fffdf5', roughness: 0.4 });
  for (const s of [-1, 1]) {
    const tooth = new THREE.Mesh(new THREE.CapsuleGeometry(0.011, 0.028, 4, 10), toothMat);
    tooth.position.x = s * 0.012; teeth.add(tooth);
  }
  pig.add(teeth);

  const eyes = [], arcs = [], brows = [];
  let eyeS = 1, angry = false;
  [-1, 1].forEach((s, i) => {
    // 눈: 작고 까맣고, 얼굴 옆쪽 높은 곳
    const eye = ell([0.07, 0.07, 0.07], EYES[i].clone().add(V(-s * 0.012, 0, -0.012)), null, skin({ color: pt.eye || '#17100e', roughness: 0.05 }));
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.013, 10, 10), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
    hl.position.set(-s * 0.014, 0.026, 0.052); eye.add(hl); pig.add(eye); eyes.push(eye);
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.014, 8, 16, Math.PI), skin({ color: '#17100e' }));   // 웃는 눈
    arc.position.copy(eye.position); arc.lookAt(eye.position.clone().multiplyScalar(2).sub(V(0, 0.5, 0.1)));
    arc.visible = false; pig.add(arc); arcs.push(arc);
    const brow = ell([0.062, 0.013, 0.013], eye.position.clone().add(V(-s * 0.012, 0.062, 0.05)), '#17100e');   // 짜증 난 눈썹
    brow.rotation.z = s * 0.5; brow.visible = false; pig.add(brow); brows.push(brow);
    // 귀: 머리 옆에서 꽃잎처럼 처진 얇은 귀
    const ep = P(dir(s * 0.8, 0.62, 0.3));
    const eg = new THREE.SphereGeometry(1, 24, 16); eg.scale(0.155, 0.075, 0.016);
    const ea = eg.attributes.position;
    for (let k = 0; k < ea.count; k++) ea.setZ(k, ea.getZ(k) + 2.2 * (ea.getX(k) ** 2 + ea.getY(k) ** 2) + 9 * Math.max(0, ea.getY(k)) ** 2 + 0.25 * Math.sin(ea.getX(k) * 30) * ea.getY(k));   // 오목하게
    eg.computeVertexNormals();
    const earCol = pt.ear || fn(ep.x, ep.y, ep.z).multiplyScalar(0.85).lerp(PINK, 0.22);
    const ear = new THREE.Mesh(eg, skin({ color: earCol, side: THREE.DoubleSide })); ear.castShadow = true;
    ear.position.copy(ep).add(V(s * 0.07, -0.03, 0.03)); ear.rotation.set(-0.55, s * 0.3, -s * 0.45); pig.add(ear);
    // 발: 분홍 발가락
    const feet = pt.feet || PINK;
    const paw = new THREE.Group(); paw.position.set(s * 0.17, 0.035, 0.6); pig.add(paw);
    paw.add(ell([0.06, 0.035, 0.07], [0, 0, 0], feet));
    for (let k = 0; k < 4; k++) paw.add(ell([0.016, 0.018, 0.045], [(k - 1.5) * 0.028, -0.008, 0.07 - Math.abs(k - 1.5) * 0.008], feet));
    pig.add(ell([0.09, 0.045, 0.12], [s * 0.4, 0.04, -0.3], feet));
    for (let w = 0; w < 4; w++) {                          // 수염
      const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.0028, 0.001, 0.3, 4), new THREE.MeshBasicMaterial({ color: '#fffaf0' }));
      wh.position.set(s * 0.29, NOSE.y - 0.05 - w * 0.014, NOSE.z - 0.06);
      wh.rotation.set(0.3, 0, -s * (1.2 + w * 0.17)); pig.add(wh);
    }
  });

  pig.userData.setOpen = o => {                             // 입 벌리기 0 ~ 1
    mouth.scale.set(0.045 + 0.035 * o, 0.006 + 0.07 * o, 0.045); mouth.visible = o > 0.03;
    mouth.position.set(0, MOUTH.y - 0.045 * o, MOUTH.z - 0.03);
    lip.position.set(0, MOUTH.y + 0.004 - 0.115 * o, MOUTH.z - 0.022 - 0.02 * o);
    teeth.position.set(0, MOUTH.y + 0.018 - 0.008 * o, MOUTH.z + 0.012);
    teeth.scale.y = Math.min(1, o * 3); teeth.visible = o > 0.05;
  };
  pig.userData.tick = t => {
    pig.scale.set(1, 1 + 0.012 * Math.sin(t * 2.2), 1);
    nose.position.y = NOSE.y + 0.005 * Math.sin(t * 9);
    const blink = (t % 3.4) < 0.12 ? 0.1 : 1;
    eyes.forEach(e => e.scale.set(eyeS, (angry ? 0.5 : eyeS) * blink, eyeS));
  };
  pig.userData.setHappy = h => { eyes.forEach(e => e.visible = !h); arcs.forEach(a => a.visible = h); };
  pig.userData.setEye = v => { eyeS = v; };                 // 놀라면 눈이 커진다
  pig.userData.setAngry = a => { angry = a; brows.forEach(b => b.visible = a); };
  pig.userData.setOpen(0);
  return pig;
}



// ---------- 빼빼로 ----------
const LEN = 1.15, NEED = 5, BISCUIT = '#e3bb7c';
const FLAVORS = [
  { name: '오리지널', img: 'original', coat: '#5a3320' },
  { name: '아몬드', img: 'almond', coat: '#5a3320', bits: { colors: ['#5a3320', '#663c26', '#c79a5e'], n: 46, r: [0.015, 0.011, 0.011] } },
  { name: '누드', img: 'nude', nude: true },
  { name: '화이트쿠키', img: 'white', coat: '#f6efe2', bits: { colors: ['#2e2220'], n: 60, r: [0.007, 0.007, 0.004] } },
  { name: '크런키', img: 'crunky', coat: '#5a3320', bits: { colors: ['#5a3320', '#6b4029'], n: 80, r: [0.01, 0.01, 0.01] } },
];
// 손잡이 끝이 원점, +y 쪽이 초콜릿 끝
function makeStick(f) {
  const g = new THREE.Group(), rB = f.nude ? 0.019 : 0.0135;
  const b = new THREE.Mesh(new THREE.CylinderGeometry(rB, rB, LEN, 16), skin({ color: BISCUIT })); b.position.y = LEN / 2; g.add(b);
  if (f.nude) {
    const core = ell([0.012, 0.006, 0.012], [0, LEN, 0], '#4a2a1a'); g.add(core);
  } else {
    const cm = skin({ color: f.coat, roughness: 0.45 }), y0 = LEN * 0.2;
    const coat = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, LEN - y0, 16), cm); coat.position.y = (LEN + y0) / 2; g.add(coat);
    g.add(ell([0.018, 0.018, 0.018], [0, LEN, 0], null, cm));
    if (f.bits) for (let i = 0; i < f.bits.n; i++) {
      const a = Math.random() * 6.283, y = y0 + 0.03 + Math.random() * (LEN - y0 - 0.03);
      const bit = ell(f.bits.r, [Math.cos(a) * 0.019, y, Math.sin(a) * 0.019], f.bits.colors[i % f.bits.colors.length]);
      bit.rotation.set(Math.random() * 3, Math.random() * 3, 0); g.add(bit);
    }
  }
  return g;
}

// ---------- 소리 (코드로 만든 소리) ----------
let ac = null;
// 아이폰 무음 스위치가 켜져 있어도 들리게: 소리 없는 <audio>를 틀어 두면 게임 소리가 미디어 소리로 나간다
let hush = null;
function silentWav() {
  const n = 4000, b = new Uint8Array(44 + n).fill(128, 44), v = new DataView(b.buffer);
  const w = (o, t) => [...t].forEach((c, i) => b[o + i] = c.charCodeAt(0));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
}
addEventListener('visibilitychange', () => { if (hush && document.hidden) hush.pause(); });
function unlock() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    if (!hush) { hush = new Audio(silentWav()); hush.loop = true; hush.setAttribute('playsinline', ''); }
    if (hush.paused) hush.play().catch(() => {});
  } catch (e) {}
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state !== 'running') ac.resume().catch(() => {});
  prep();
}
['pointerdown', 'pointerup', 'touchend', 'click'].forEach(n => addEventListener(n, unlock, true));
// 오독 소리: img/odok.wav = 0.07초 칸 5개. 출처 "crunch" · "crunch 2" by Gravity Sound (CC BY 4.0, Wikimedia Commons)에서 가장 날카로운 순간을 잘라 씀
let snapData = null, snaps = null;
fetch('img/odok.wav').then(r => r.arrayBuffer()).then(b => { snapData = b; prep(); }).catch(() => {});
function prep() { if (ac && !snaps && snapData) { const d = snapData; snapData = null; ac.decodeAudioData(d, b => { snaps = b; }, () => {}); } }
function crunch(hi, count = 1) {                            // hi = 0 '오', 1 '독'. count = 먹고 있는 막대 수
  window.__snd = (window.__snd || 0) + 1;                   // 시험용
  if (!ac) return;
  if (snaps) {                                              // 입을 다물 때마다, 막대 수만큼 겹쳐서
    for (let i = 0; i < count; i++) {
      const src = ac.createBufferSource(), gain = ac.createGain(), k = Math.floor(Math.random() * 5);
      src.buffer = snaps; src.playbackRate.value = (hi ? 1.12 : 0.92) * (0.94 + Math.random() * 0.12); gain.gain.value = 0.55;
      src.connect(gain).connect(ac.destination); src.start(ac.currentTime + i * 0.032 + (i ? Math.random() * 0.012 : 0), k * 0.07, 0.07);
    }
    return;
  }
  const n = ac.sampleRate * 0.08, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
  const src = ac.createBufferSource(), hp = ac.createBiquadFilter(), gain = ac.createGain();
  src.buffer = buf; src.playbackRate.value = 0.8 + Math.random() * 0.5;
  hp.type = 'highpass'; hp.frequency.value = 1300; gain.gain.value = 0.6;
  src.connect(hp).connect(gain).connect(ac.destination); src.start();
}
function puff() {                                           // 퉤
  if (!ac) return;
  const n = ac.sampleRate * 0.13, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 3;
  const src = ac.createBufferSource(), bp = ac.createBiquadFilter(), gain = ac.createGain();
  src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8; gain.gain.value = 0.9;

}
function tock() {                                           // 빼빼로가 바닥에 떨어지는 작은 소리 (톡, 또 한 번 작게)
  if (!ac || !snaps) return;
  [[0, 0.3], [0.1, 0.13]].forEach(([at, vol]) => {
    const src = ac.createBufferSource(), gain = ac.createGain();
    src.buffer = snaps; src.playbackRate.value = 1.7 + Math.random() * 0.5; gain.gain.value = vol;
    src.connect(gain).connect(ac.destination); src.start(ac.currentTime + at, Math.floor(Math.random() * 5) * 0.07, 0.03);
  });
}
function hmph() {                                           // 흥, 삐진 콧숨 (작게)
  if (!ac) return;
  const n = ac.sampleRate * 0.3, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.min(1, i / (n * 0.08)) * (1 - i / n) ** 1.6;

function squeak(times) {
  if (!ac) return;
  for (let k = 0; k < times; k++) {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + k * 0.28;
    o.frequency.setValueAtTime(900, t); o.frequency.exponentialRampToValueAtTime(2300, t + 0.16);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.24);
  }
}

// ---------- 화면 ----------
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const FOV = 30, camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 80);
scene.add(new THREE.HemisphereLight('#fff6ea', '#e9b98f', 1.5));
const sun = new THREE.DirectionalLight('#ffffff', 2.0);
sun.position.set(2.5, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 6;
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 3, bottom: -3 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 48), new THREE.ShadowMaterial({ opacity: 0.2, depthWrite: false }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

let exitX = 3;
function resize() {
  const w = innerWidth, h = innerHeight, t = Math.tan(FOV * Math.PI / 360);
  renderer.setSize(w, h, false); camera.aspect = w / h;
  const d = Math.max(4, 3.75 / (2 * t * camera.aspect));      // 기니피그가 화면 너비에 맞게
  camera.position.set(0, 0.55 + d * 0.13, d); camera.lookAt(0, 0.42, 0);
  camera.updateProjectionMatrix();
  exitX = d * t * camera.aspect + 1.2;
}
addEventListener('resize', resize); resize();

// ---------- 게임 상태 ----------
let pig, patIndex = -1, state = 'idle', st = 0, eaten = 0, open = 0, pigs = 0;
const PIGS = 3;                                          // 이만큼 먹이면 끝 버튼
let stick = null, flavor = null, dragging = false;
const eats = [], fly = [], drops = [];                    // 먹는 중인 막대, 뱉어져 날아가는 막대, 땀방울
let chewT = 0, chewN = 0, shock = 0, jolt = 0, sweatT = 0, spat = false, huffed = false;
const H = V(0, 0, 0), crumbs = [];
const MOUTH_LOCAL = V(0, MOUTH.y - 0.03, MOUTH.z + 0.01), UPY = V(0, 1, 0);
const mouthWorld = () => pig.localToWorld(MOUTH_LOCAL.clone());

function newPig() {
  let i; do { i = Math.floor(Math.random() * PATTERNS.length); } while (i === patIndex);
  if (q.has('p') && patIndex < 0) i = +q.get('p');
  patIndex = i;
  if (pig) scene.remove(pig);
  pig = makePig(PATTERNS[i]); scene.add(pig);
}
function enter() { newPig(); pig.position.x = -exitX; pig.rotation.y = Math.PI / 2; state = 'walkIn'; st = 0; }
const again = document.getElementById('again');
const endEl = document.getElementById('end');
again.onclick = () => { endEl.style.display = 'none'; pigs = 0; enter(); };   // 다시 시작
const dotsEl = document.getElementById('dots');
const drawDots = () => dotsEl.textContent = '♥'.repeat(eaten) + '♡'.repeat(NEED - eaten);

function hearts() {
  for (let i = 0; i < 9; i++) setTimeout(() => {
    const h = document.createElement('div'); h.className = 'heart'; h.textContent = '♥';
    h.style.left = (innerWidth * (0.2 + Math.random() * 0.6)) + 'px'; h.style.top = (innerHeight * (0.3 + Math.random() * 0.2)) + 'px';
    document.body.appendChild(h); setTimeout(() => h.remove(), 1400);
  }, i * 110);
}
function addCrumbs(color) {
  const m = mouthWorld();
  for (let i = 0; i < 6; i++) {
    const c = ell([0.014, 0.014, 0.014], m, Math.random() < 0.5 ? color : BISCUIT);
    c.userData.v = V((Math.random() - 0.5) * 1.6, 0.6 + Math.random() * 1.2, 0.5 + Math.random() * 1.0); c.userData.life = 0.8;
    scene.add(c); crumbs.push(c);
  }
}

// 손가락 위치 → 기니피그 입 앞, 화면과 나란한 면 위의 점
const ray = new THREE.Raycaster(), plane = new THREE.Plane(), toCam = V(0, 0, 1);
function setH(x, y) {
  ray.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  camera.getWorldDirection(toCam).negate();               // 입을 지나고 화면과 나란한 면 → 막대 전체 길이가 보인다
  plane.setFromNormalAndCoplanarPoint(toCam, MOUTH_LOCAL.clone().addScaledVector(toCam, 0.15));
  ray.ray.intersectPlane(plane, H);
}
let selBox = null, tap = null;                              // 고른 상자, 누르는 중인 상자
const unselect = () => { if (selBox) { selBox.classList.remove('on'); selBox = null; } };
addEventListener('visibilitychange', () => { if (document.hidden) unselect(); });   // 다녀오면 다시 고르게
function startDrag(f, x, y) {
  if (state !== 'idle' || stick || eaten + eats.length >= NEED) return;
  if (hint) { hint.remove(); hint = null; try { localStorage.setItem('fed', '1'); } catch (e) {} }
  flavor = f; stick = makeStick(f); scene.add(stick); dragging = true; setH(x, y); stick.position.copy(H);
}
function endDrag() {
  if (!dragging) return;
  dragging = false;
  const m = mouthWorld(), dist = m.distanceTo(H);
  if (dist - LEN >= 0.4) { scene.remove(stick); stick = null; return; }
  if (eats.length >= 3) {                                   // 4개째 → 짜증 내며 뱉는다
    eats.forEach(e => fly.push(e.stick)); eats.length = 0; fly.push(stick); stick = null;
    state = 'spit'; st = 0; spat = false; huffed = false; shock = 0; pig.userData.setAngry(true);
    return;
  }
  if (eats.length) { shock = Math.min(0.75, shock + 0.25); jolt = 1; }   // 먹는 중에 또 주면 놀란다
  else { chewT = 0; chewN = 0; }
  let slot = 0; while (eats.some(e => e.slot === slot)) slot++;
  eats.push({ stick, flavor, slot, t: 0, n: 0, bite: 0, ins: 0, end: 0, a0: m.sub(H).normalize() });
  stick = null;
}
const tray = document.getElementById('tray');
FLAVORS.forEach(f => {
  const b = document.createElement('div'); b.className = 'box';
  b.innerHTML = `<img src="img/box_${f.img}.png" alt="${f.name}" draggable="false">`;
  b.onpointerdown = e => {
    e.preventDefault();
    if (b === selBox && ac && ac.state !== 'running') unselect();   // 소리가 잠겼으면 다시 톡 눌러 고르게 한다
    if (b === selBox) startDrag(f, e.clientX, e.clientY);   // 고른 상자만 끌 수 있다
    else tap = { b, x: e.clientX, y: e.clientY };
  };
  tray.appendChild(b);
});
addEventListener('pointermove', e => { if (dragging) setH(e.clientX, e.clientY); });
addEventListener('pointerup', e => {
  if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 12) {   // 톡 누름 → 고르기
    if (selBox) selBox.classList.remove('on');
    selBox = tap.b; selBox.classList.add('on');
  }
  tap = null; endDrag();
});
addEventListener('pointercancel', () => { tap = null; endDrag(); });
addEventListener('contextmenu', e => e.preventDefault());

// ---------- 매 프레임 ----------
const IN = dir(0, 0.12, -1), Q = new THREE.Quaternion(), CHEW = 0.19;   // 한 번 씹는 시간(초)
function placeStick(stick, origin, axis, k) {
  stick.position.lerp(origin, k); Q.setFromUnitVectors(UPY, axis); stick.quaternion.slerp(Q, k);
}
const SLOT_X = [0, -0.42, 0.42];                          // 여러 개를 물 때 벌어지는 방향
let last = 0;
const FAST = +(q.get('fast') || 1);   // 시험용 빨리 감기
function frame(ms) {
  const t = ms / 1000, dt = Math.min(0.05, t - last) * FAST; last = t; st += dt;
  let openT = 0, yawT = 0, hop = 0;
  pig.userData.tick(t);

  if (state === 'idle') {
    if (dragging) {
      const m = mouthWorld(), a = m.clone().sub(H), dist = a.length(); a.normalize();
      placeStick(stick, dist >= LEN ? H : m.clone().addScaledVector(a, -LEN), a, 0.6);
      openT = Math.min(1, Math.max(0, 1 - (dist - LEN) / 1.4));
    }
    if (eats.length) {
      // 입을 다무는 순간마다 소리 한 번. 두 번('오' '독') 씹을 때마다 한 입 줄어든다
      chewT += dt;
      const ch = Math.floor((chewT - CHEW / 2) / CHEW) + 1, chomp = ch > chewN;
      if (chomp) { chewN = ch; const cnt = eats.filter(e => e.n < 14).length; if (cnt) crunch((ch - 1) % 2, cnt); }
      openT = Math.max(openT, 0.12 + 0.55 * Math.abs(Math.cos(Math.PI * chewT / CHEW)));
      for (let i = eats.length - 1; i >= 0; i--) {
        const e = eats[i]; e.t += dt;
        if (chomp && e.n < 14 && ++e.n % 2) { e.bite++; addCrumbs(e.flavor.coat || BISCUIT); }
        e.ins += (e.bite * LEN / 7 - e.ins) * 0.25;
        const a = e.a0.clone().lerp(V(SLOT_X[e.slot], 0.12, -1).normalize(), Math.min(1, e.t / 0.3)).normalize();
        placeStick(e.stick, mouthWorld().addScaledVector(a, -(LEN - e.ins)), a, 0.45);
        if (e.n >= 14 && (e.end += dt) > 0.25) {
          scene.remove(e.stick); eats.splice(i, 1); eaten++; drawDots();
          if (!eats.length) {
            if (eaten >= NEED) { state = 'happy'; pig.userData.setHappy(true); hearts(); squeak(3); } else squeak(1);
            st = 0;
          }
        }
      }
    }
  } else if (state === 'spit') {                            // 짜증 → 퉤 → 도도하게 고개 돌림 → 원래대로
    if (st > 0.45 && !spat) {
      spat = true; puff(); eaten = 0; drawDots();           // 하트도 처음부터
      fly.forEach(f => { f.userData.v = V((Math.random() - 0.5) * 2.4, 1.2 + Math.random(), 2.4 + Math.random()); });
    }
    openT = st > 0.4 && st < 0.7 ? 0.6 : 0;
    if (st > 0.75 && st < 1.9) yawT = 0.45;
    if (st > 0.9 && !huffed) { huffed = true; hmph(); }
    if (st > 2.3) { pig.userData.setAngry(false); state = 'idle'; st = 0; }
  } else if (state === 'happy') {
    hop = Math.abs(Math.sin(st * 7)) * 0.13; openT = 0.3;
    if (st > 1.0) { state = 'turnOut'; st = 0; }
  } else if (state === 'turnOut') {
    pig.rotation.y = Math.min(1, st / 0.35) * Math.PI / 2; openT = 0.15;
    if (st > 0.35) { state = 'walkOut'; st = 0; }
  } else if (state === 'walkOut' || state === 'walkIn') {
    pig.position.x += 2.8 * dt; hop = Math.abs(Math.sin(st * 16)) * 0.035; pig.rotation.z = Math.sin(st * 16) * 0.05;
    if (state === 'walkOut' && pig.position.x > exitX) {
      pigs++; eaten = 0; drawDots();
      if (pigs >= PIGS) { pig.visible = false; state = 'end'; endEl.style.display = 'flex'; }
      else enter();
    } else if (state === 'walkIn' && pig.position.x >= 0) {
      pig.position.x = 0; pig.rotation.z = 0; state = 'turnIn'; st = 0;
    }
  } else if (state === 'turnIn') {
    pig.rotation.y = (1 - Math.min(1, st / 0.35)) * Math.PI / 2;
    if (st > 0.35) { state = 'idle'; st = 0; }
  }
  if (state === 'idle' || state === 'spit' || state === 'happy') {
    pig.rotation.y += (yawT - pig.rotation.y) * 0.15;
    if (state === 'idle' && st < 0.4 && eaten > 0 && !eats.length) hop = Math.sin(st / 0.4 * Math.PI) * 0.05;   // 다 먹고 폴짝
  }
  // 놀람: 움찔하고 눈이 커졌다가 천천히 돌아온다
  shock = Math.max(0, shock - 0.22 * dt); jolt *= Math.exp(-9 * dt);
  pig.userData.setEye(1 + shock);
  const chin = state === 'spit' && st > 0.75 && st < 1.9 ? 0.13 : 0;   // 도도하게 턱을 든다
  pig.rotation.x += (-(jolt * 0.14 + chin) - pig.rotation.x) * 0.3;
  pig.position.y = hop + jolt * 0.07;
  open += (openT - open) * (eats.length ? 0.6 : 0.3); pig.userData.setOpen(open);   // 먹을 때는 박자에 바로 맞게

  // 땀: 3개를 한꺼번에 물면 이마 옆으로 흘러내린다
  if (state === 'idle' && eats.length >= 3 && (sweatT -= dt) <= 0) {
    sweatT = 0.28; const sd = Math.random() < 0.5 ? -1 : 1;
    const d = ell([0.03, 0.043, 0.03], [0, 0, 0], '#8fd4ff'); d.userData = { d: dir(sd * (0.42 + Math.random() * 0.2), 0.8, 0.62), life: 0.9 };
    pig.add(d); drops.push(d);
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i], u = d.userData; u.life -= dt; u.d.y -= 0.42 * dt; u.d.normalize();
    d.position.copy(P(u.d)).multiplyScalar(1.03); d.scale.setScalar(Math.min(1, u.life * 3));
    if (u.life < 0 || d.parent !== pig) { d.removeFromParent(); drops.splice(i, 1); }
  }
  for (let i = fly.length - 1; i >= 0; i--) {              // 뱉어진 막대
    const f = fly[i], v = f.userData.v; if (!v) continue;
    v.y -= 7 * dt; f.position.addScaledVector(v, dt); f.rotation.x += 9 * dt; f.rotation.z += 5 * dt;
    if (f.position.y < 0.03 && !f.userData.hit) { f.userData.hit = true; tock(); }
    if (f.position.y < -1.5) { scene.remove(f); fly.splice(i, 1); }
  }

  for (let i = crumbs.length - 1; i >= 0; i--) {
    const c = crumbs[i]; c.userData.v.y -= 6 * dt; c.position.addScaledVector(c.userData.v, dt); c.userData.life -= dt;
    if (c.userData.life < 0 || c.position.y < 0) { scene.remove(c); crumbs.splice(i, 1); }
  }
  renderer.render(scene, camera);
}

newPig(); drawDots();
document.getElementById('load').remove();
if (q.has('pigs')) pigs = +q.get('pigs');   // 시험용
// 처음 한 번: 손가락이 상자에서 입까지 움직이며 방법을 보여 준다
let hint = null, seen = false;
try { seen = !!localStorage.getItem('fed'); } catch (e) {}
if (!seen && !q.has('demo')) {
  hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = '👆'; document.body.appendChild(hint);
  const r = tray.children[0].getBoundingClientRect(), m = mouthWorld().project(camera);
  const from = `translate(${r.left + r.width / 2 - 16}px, ${r.top + 8}px)`;
  const to = `translate(${(m.x + 1) / 2 * innerWidth - 16}px, ${(1 - m.y) / 2 * innerHeight + 6}px)`;
  hint.animate([{ transform: from, opacity: 0 }, { transform: from, opacity: 1, offset: 0.1 },
    { transform: from + ' scale(.75)', opacity: 1, offset: 0.18 }, { transform: from, opacity: 1, offset: 0.26 },
    { transform: from, opacity: 1, offset: 0.42 }, { transform: to, opacity: 1, offset: 0.85 }, { transform: to, opacity: 0 }],
    { duration: 3000, iterations: Infinity });
}
if (q.has('eaten')) { eaten = +q.get('eaten'); drawDots(); }
// 시험용: ?demo=맛 번호 → 스스로 끌어다 먹인다
if (q.has('demo')) {
  const x0 = innerWidth * 0.5, y0 = innerHeight * 0.9, y1 = innerHeight * (+(q.get('to') || 0.62)), T0 = performance.now();
  startDrag(FLAVORS[+q.get('demo')], x0, y0);
  const step = () => {
    const k = Math.min(1, (performance.now() - T0) / 900); setH(x0 + 40 * k, y0 + (y1 - y0) * k);
    if (k < 1) requestAnimationFrame(step); else if (!q.has('hold')) endDrag();
  };
  step();
}
window.__lock = () => ac && ac.suspend();   // 시험용: 소리 잠그기
window.__dbg = () => `${state} eats=${eats.length} shock=${shock.toFixed(2)} fly=${fly.length} drops=${drops.length} t=${eats.length ? chewT.toFixed(3) : -1} n=${window.__snd || 0} pigs=${pigs} snd=${!!snaps} sel=${selBox ? [...tray.children].indexOf(selBox) : -1} ac=${ac && ac.state} hush=${hush && !hush.paused} eaten=${eaten} x=${pig.position.x.toFixed(2)} open=${open.toFixed(2)} stick=${!!stick}`;   // 시험용
renderer.setAnimationLoop(frame);
</script>
